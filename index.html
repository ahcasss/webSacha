	<link href="css/animation.css" rel="stylesheet">
	<link href="css/style.css" rel="stylesheet">
	
	<script>
		let animationCount = 7;
		
		function onImageLoaded()
		{	
			if(--animationCount == 0)
			{
				document.getElementsByClassName("title")[0].classList.add("title-animated");
			}
		}
	</script>
</head>
